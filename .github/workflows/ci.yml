name: CI

# Both test suites are pure functions over synthetic claims - they never touch
# PostgreSQL - so CI needs no database service. They do need torch and the
# MiniLM embedding model, because the figure digest ranks group members by
# sentence similarity.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheels: the CUDA build is ~2GB and no runner has a GPU
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Cache the spaCy model and HuggingFace downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: models-${{ hashFiles('requirements.txt') }}

      - name: Fetch the spaCy model
        run: python install_spacy_model.py

      - name: Lint
        run: ruff check backend

      - name: Every module imports
        run: |
          python -m compileall -q backend
          python -c "
          import backend.passive, backend.active
          import backend.analysis.runner, backend.analysis.digest
          import backend.analysis.framing, backend.analysis.subject
          import backend.nlp.clustering, backend.nlp.previews, backend.nlp.search
          import backend.ingestion.runner, backend.db.migrations
          import backend.scripts.build_site, backend.scripts.export_review
          print('all pipeline modules import')
          "

      - name: Figure digest — casualty grouping
        run: python -m backend.scripts.test_casualties

      - name: Figure digest — subject and unit gate
        run: python -m backend.scripts.test_figures

  schema:
    # Proves the repository can build its own database from nothing. The base
    # tables were once created by hand and only later columns were tracked,
    # which meant a fresh clone could not reproduce the schema.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: articles
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the database driver only
        run: pip install psycopg2-binary

      - name: Build the schema from an empty database
        env:
          DB_PASSWORD: postgres
        run: |
          python - <<'PY'
          import psycopg2
          from backend.db.connection import DB_CONFIG
          from backend.db.migrations import BASE_SCHEMA, MIGRATIONS, CLEANUP

          con = psycopg2.connect(**DB_CONFIG)
          cur = con.cursor()
          for label, stmt in BASE_SCHEMA + MIGRATIONS + CLEANUP:
              cur.execute(stmt)
          con.commit()

          cur.execute("""SELECT table_name FROM information_schema.tables
                         WHERE table_schema='public' ORDER BY 1""")
          tables = [r[0] for r in cur.fetchall()]
          expected = ["articles", "cluster_analysis", "cluster_members", "clusters"]
          assert tables == expected, f"expected {expected}, got {tables}"

          cur.execute("""SELECT format_type(atttypid, atttypmod) FROM pg_attribute
                         WHERE attrelid='articles'::regclass AND attname='embedding'""")
          assert cur.fetchone()[0] == "vector(384)", "embedding dimension not pinned"

          # a real write, so NOT NULL and the vector dimension are exercised
          cur.execute("""INSERT INTO articles
              (identifier, source_name, title, url, url_canon, published_utc, embedding)
              VALUES ('ci','Test','T','u','u', now(), %s)""",
              ("[" + ",".join(["0.1"] * 384) + "]",))
          con.commit()
          print(f"schema bootstrap OK: {tables}")
          PY
